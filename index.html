function scrollToElement(el, gap=14, behavior='auto') {
  if(!el)return;
  const header=$('#header').offsetHeight;
  const dock=$('#date-dock').hidden?0:$('#date-dock').offsetHeight;
  const y=el.getBoundingClientRect().top+window.scrollY-header-dock-gap;
  window.scrollTo({top:Math.max(0,y),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':behavior});
}
function laterScroll(fn){requestAnimationFrame(()=>requestAnimationFrame(fn));}
function scrollCurrent(first=false){const idx=first?0:currentPosition?.index||0;laterScroll(()=>scrollToElement(document.getElementById(currentEvents[idx]?.id)));}

function timeMarkup(e){
  if(!e.start)return `<span class="time-flex">${esc(e.time)}</span>`;
  let suffix=e.end?`${e.time.includes('→')?'→':'–'} ${e.end}`:'';
  if(e.id==='d6-t0-r1')suffix='／ 09:20';
  if(e.id==='d5-t0-r2')suffix='– 10:15';
  const startZone=e.startOffset?(e.startOffset==='+08:00'?'台灣':'日本'):'';
  const endZone=e.endOffset?(e.endOffset==='+08:00'?'台灣':'日本'):'';
  return `<span class="time-start">${esc(e.start)}</span>${startZone?`<span class="time-zone">${startZone}</span>`:''}${suffix?`<span class="time-end">${esc(suffix)}</span>`:''}${endZone?`<span class="time-zone">${endZone}</span>`:''}${e.approx&&!startZone?'<span class="time-zone">約</span>':''}`;
}
function eventAction(e){
  if(!e.places?.length)return '';
  const single=e.places.length===1, p=DATA.places[e.places[0]];
  const mode=e.mode||p.mode;
  const label=e.origin&&mode!=='search'?'路線':mode==='search'?'地圖':'導航';
  const names=e.places.map(key=>DATA.places[key].name).join(' / ');
  const title=e.origin?`${DATA.places[e.origin].name} → ${p.name}`:names;
  return `<div class="event-action-row"><span class="event-place-label" lang="ja">${icon('pin','tiny-icon')}<span class="place-label-text">${esc(title)}</span></span>${single?`<a class="map-action" href="${esc(mapRoute(p,mode,e.origin))}" ${linkAttrs} aria-label="${label}：${esc(title)}">${icon(mode==='search'?'pin':'navigation')}${label}</a>`:`<button class="map-action" data-action="event-places" data-event="${e.id}" aria-label="選擇${esc(e.title)}的地點">${icon('pin')}選地點</button>`}<button class="copy-action" data-action="${single?'copy-place':'event-places'}" ${single?`data-place="${e.places[0]}"`:`data-event="${e.id}"`} aria-label="複製${single?esc(p.name):'本行程日文地名'}" title="複製日文地名">${icon('copy')}</button></div>`;
}

function setDay(index,{scroll=true,follow=false}={}){if(index<0||index>=DATA.days.length)return;ui.day=index;ui.followToday=follow;ui.view='itinerary';showView();renderDay(scroll);}
function showView(){
  for(const name of ['itinerary','tasks','guide'])$(`#view-${name}`).hidden=ui.view!==name;
  $('#hero-wrap').hidden=ui.view!=='itinerary';$('#date-dock').hidden=ui.view!=='itinerary';
  $$('[data-tab]').forEach(b=>{const yes=b.dataset.tab===ui.view;b.classList.toggle('active',yes);if(yes)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  setCssHeights();
}
function switchTab(name){
  if(!['itinerary','tasks','guide'].includes(name))return;
  ui.view=name;showView();

  else{if(name==='tasks')renderTasks();else renderGuide();window.scrollTo({top:0,behavior:'auto'});}
}
function goNow(notify=true){
  const today=dayAt();setDay(today>=0?today:0,{scroll:true,follow:true});
  if(today<0 && notify)toast('目前不在旅行日期內，已回到 D1 第一個行程。');
}
function dueStatus(task){
  if(isDone(task))return '';
  const now=clockNow();
  if(task.hardAt&&now.getTime()>new Date(task.hardAt).getTime())return task.deadlineKind==='官方截止'?'已過官方截止':'已過網路報名時間';
  if(partsAt(now).date>task.sortDate)return /建議|複核/.test(task.deadlineKind)?'請依節點再查':'請核對處理進度';
  if(partsAt(now).date===task.sortDate)return '今天處理';
  return '';
}

function filteredTasks(){
  const query=ui.taskQuery.trim().toLowerCase();
  return DATA.tasks.filter(t=>{
    if(ui.taskFilter==='open'&&isDone(t))return false;
    if(ui.taskFilter==='done'&&!isDone(t))return false;
    if(ui.taskFilter==='key'&&(!t.key||isDone(t)))return false;
    if(query && !`${t.id} ${t.applies} ${t.title} ${t.summary} ${t.action} ${t.deadline}`.toLowerCase().includes(query))return false;
    return true;
  }).sort((a,b)=>{
    const priority=t=>isDone(t)?3:['官方截止','預約期限'].includes(t.deadlineKind)?0:t.key?1:2;
    return priority(a)-priority(b)||a.sortDate.localeCompare(b.sortDate)||a.id.localeCompare(b.id);
  });
}

function toggleTask(id){
  if(!KNOWN_IDS.has(id))return;
  const task=DATA.tasks.find(t=>t.id===id);
  if(task?.steps){const next=!isDone(task);for(const s of task.steps)saved.done[s.id]=next;}
  else saved.done[id]=!saved.done[id];
  saveState();updateCounts();
  const oldScroll=window.scrollY;
  if(ui.view==='tasks'){
    renderTasks();window.scrollTo({top:oldScroll,behavior:'auto'});
    const button=$(`[data-action="toggle-task"][data-id="${id}"]`);
    if(button)button.focus({preventScroll:true});
  }
}
function openTask(id){
  if(!DATA.tasks.some(t=>t.id===id))return;
  ui.taskFilter='all';ui.taskQuery=id;ui.view='tasks';showView();renderTasks();
  laterScroll(()=>scrollToElement(document.getElementById(`task-${id}`)));
}

async function copyText(text){

  const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:0;top:0;opacity:0;font-size:16px';document.body.appendChild(area);
  let ok=false;
  try{area.focus({preventScroll:true});area.select();area.setSelectionRange(0,text.length);ok=document.execCommand('copy');}catch{}
  area.remove();
  if(ok){toast('已複製日文地名');return;}
  showDialog('手動複製地名',`<p>瀏覽器沒有允許剪貼簿存取。請長按下方文字、選取並複製。</p><textarea class="copy-field" readonly aria-label="可手動複製的日文地名">${esc(text)}</textarea>`);

async function registerOffline(){

    const markReady=async()=>{try{const url=new URL('./index.html',location.href);const cached=await caches.match(url.href);offlineReady=!!cached;updateOfflineStatus();}catch{}};
    navigator.serviceWorker.ready.then(markReady);
